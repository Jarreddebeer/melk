<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 236" width="440" height="236" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
  </marker>
</defs>
<rect width="440" height="236" fill="#fafafa"/>
<g transform="translate(32 84)">
<g data-edge="client->gateway">
  <path d="M 40 20 L 80 20" stroke="#94a3b8" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<g data-edge="gateway->auth">
  <path d="M 128 20 L 168 20" stroke="#94a3b8" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<g data-edge="auth->ledger">
  <path d="M 208 20 L 248 20" stroke="#94a3b8" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<g data-edge="ledger->receipt">
  <path d="M 288 20 L 328 20" stroke="#94a3b8" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<g data-edge="ledger->audit_log">
  <path d="M 268 40 L 268 80" stroke="#94a3b8" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<g data-id="client">
  <rect x="0" y="0" width="40" height="40" rx="2" ry="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="20" y="20" text-anchor="middle" dominant-baseline="central" fill="#334155">client</text>
</g>
<g data-id="gateway">
  <rect x="80" y="0" width="48" height="40" rx="2" ry="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="104" y="20" text-anchor="middle" dominant-baseline="central" fill="#334155">gateway</text>
</g>
<g data-id="auth">
  <rect x="168" y="0" width="40" height="40" rx="2" ry="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="188" y="20" text-anchor="middle" dominant-baseline="central" fill="#334155">auth</text>
</g>
<g data-id="ledger">
  <rect x="248" y="0" width="40" height="40" rx="2" ry="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="268" y="20" text-anchor="middle" dominant-baseline="central" fill="#334155">ledger</text>
</g>
<g data-id="receipt">
  <rect x="328" y="0" width="48" height="40" rx="2" ry="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
