</g>
<g data-id="audit_log">
  <path d="M 240 90 A 28 10 0 0 1 296 90 L 296 110 A 28 10 0 0 1 240 110 Z" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><path d="M 240 90 A 28 10 0 0 0 296 90" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="268" y="100" text-anchor="middle" dominant-baseline="central" fill="#334155">audit_log</text>
</g>
</g>
<g data-title-strip="1" transform="translate(0 0)">
<text x="32" y="33" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#334155" data-row="title" text-anchor="start" dominant-baseline="alphabetic">Payment platform</text>
</g>
